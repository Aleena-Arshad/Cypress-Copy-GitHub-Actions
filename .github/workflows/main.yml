# With HTML Reporting

# With HTML Reporting and Scheduled Run
name: Cypress Tests

on:
  # Run on push only for main branch
  push:
    branches:
      - main
  # Run on pull request events
  pull_request:
  # Manual trigger
  workflow_dispatch:
  # Scheduled run at 1:58 PM Pakistan time
  schedule:
    - cron: '30 13 * * *'

jobs:
  cypress-run:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history to allow pull/fetch

      - name: Pull Latest Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "Fetching PR head branch"
            git fetch origin +refs/pull/${{ github.event.pull_request.number }}/head:pr-${{ github.event.pull_request.number }}
            git checkout pr-${{ github.event.pull_request.number }}
          else
            echo "Fetching current branch"
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}
          fi

      - name: Install Dependencies
        run: npm ci

      - name: Create reports folder
        run: mkdir -p cypress/reports

      - name: Run Cypress Tests
        run: |
          npx cypress run \
            --browser chrome \
            --reporter cypress-mochawesome-reporter \
            --reporter-options reportDir=cypress/reports,json=true,html=true,overwrite=true
        continue-on-error: true

      - name: Upload Cypress Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cypress Artifacts
          path: |
            cypress/screenshots
            cypress/videos
            cypress/reports


