# With HTML Reporting

# With HTML Reporting and Scheduled Run

name: Cypress Tests

on:
  push:
  workflow_dispatch:
  schedule:
    # Runs every day at 1:00 PM UTC
    - cron: '0 8 * * *'
    # Example: To run every Monday at 1:00 PM UTC
    # - cron: '0 13 * * 1'

jobs:
  cypress-run:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history to allow pull/fetch

      - name: Pull Latest Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git fetch origin
          git reset --hard origin/${{ github.ref_name }}

      - name: Install Dependencies
        run: npm ci

      - name: Create reports folder
        run: mkdir -p cypress/reports

      - name: Run Cypress Tests
        run: |
          npx cypress run \
            --browser chrome \
            --reporter cypress-mochawesome-reporter \
            --reporter-options reportDir=cypress/reports,json=true,html=true,overwrite=true
        continue-on-error: true

      - name: Upload Cypress Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cypress Artifacts
          path: |
            cypress/screenshots
            cypress/videos
            cypress/reports



